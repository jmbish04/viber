name: CI

on:
    push:
        branches: ['**'] # Run on all branches
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ${{ github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","proxmox-actions"]') }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run build
              run: bun run build

        # - name: Run linter
        #   run: bun run lint

        # - name: Run tests
        #   run: bun run test
